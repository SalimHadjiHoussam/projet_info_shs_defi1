<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart.js</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 
  <script src="script.js" defer></script>
  

</head>
<body>


<div>
  <canvas id="myChart1"></canvas>
</div> <br>



<section style="
    font-family: Arial, sans-serif; 
    background-color: #f8f9fa; 
    padding: 20px; 
    border-radius: 10px; 
    border-left: 6px solid #4A90E2; 
    margin: 20px 0; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
">
    <h2 style="
        color: #2c3e50; 
        margin-top: 0; 
        font-size: 1.4rem; 
        border-bottom: 1px solid #ddd; 
        padding-bottom: 10px;
    ">
        Observation
    </h2>
    <div style="margin-top: 15px;">
        <p style="
            line-height: 1.7; 
            color: #333; 
            font-size: 1.1rem; 
            margin: 0;
        ">
            Nous observons que, sur ces quatre dernières années, les 
            <strong style="color: #4A90E2;">hommes</strong> sont nettement plus nombreux dans les effectifs. 
            Cependant, en termes statistiques, les 
            <strong style="color: #D0021B;">femmes</strong> affichent un 
            <span style="background-color: #e8f4fd; padding: 2px 5px; border-radius: 4px; font-weight: bold;">taux de réussite supérieur</span>, 
            avec un pourcentage de passage plus élevé malgré un effectif de départ plus réduit.
        </p>        
    </div>
</section>
</body>
</html>
